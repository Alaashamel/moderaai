[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moderaai"
version = "0.1.0"
description = "Lightweight text moderation API — classifies content as safe, toxic, or spam."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alaa Shamel" }]
dependencies = [
    "scikit-learn>=1.3",
    "click>=8.1",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.25"]
transformer = ["transformers>=4.35", "torch>=2.0"]

[project.scripts]
moderaai = "moderaai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moderaai = ["data/*.csv"]
